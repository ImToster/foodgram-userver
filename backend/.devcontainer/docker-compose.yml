services:
  backend:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg-dev:v3.2
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      silo:
        condition: service_healthy
    environment:
      CCACHE_DIR: /home/user/foodgram/.ccache
      CORES_DIR: /cores
      PREFIX: ${PREFIX:-~/.local}
      SHELL: /bin/bash
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    volumes:
      - ..:/home/user/foodgram

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: foodgram
      POSTGRES_USER: foodgram_user
      POSTGRES_PASSWORD: foodgram_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodgram_user -d foodgram"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../postgresql/schemas/foodgram/migrations:/migrations
      - ../postgresql/initial_data:/initial_data
      - ../demo_data:/demo_data:ro
      - ../postgresql/initdb.sh:/docker-entrypoint-initdb.d/00_init.sh

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    container_name: foodgram-silo
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - silo_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: foodgram-media
    volumes:
      - ../demo_data/media:/seed
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://silo:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      mc mb local/$$S3_BUCKET --ignore-existing;
      mc anonymous set download local/$$S3_BUCKET;
      if [ -d /seed ]; then mc mirror --overwrite --exclude '.gitkeep' /seed local/$$S3_BUCKET; fi;
      exit 0;
      "

  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    environment:
      S3_BUCKET: foodgram-media
    volumes:
      - ../../nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_started
      silo:
        condition: service_healthy

volumes:
  pg_data:
  silo_data: