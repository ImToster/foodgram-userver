  responses:
    Error:
      description: 'Ошибка в формате userver: код и текст сообщения.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                description: |
                  Машиночитаемый код ошибки. Доменные коды: invalid_credentials,
                  unauthorized, email_taken, username_taken, user_exists,
                  invalid_current_password,
                  cannot_subscribe_to_self, subscription_exists,
                  cannot_unsubscribe_from_self, subscription_not_exists,
                  recipe_already_favorited, recipe_not_favorited,
                  recipe_already_in_cart, recipe_not_in_cart, shopping_cart_empty,
                  ingredient_not_found, duplicate_ingredients, invalid_image,
                  unsupported_image_format, validation_error. Также возможны fallback-коды userver:
                  forbidden, not_found, bad_request, client_error,
                  internal_server_error.
              message:
                type: string
                description: 'Текст ошибки.'
            required:
              - code
              - message
  securitySchemes:
    bearerAuth:
      description: 'JWT-токен в заголовке "Authorization: Bearer TOKENVALUE".'
      type: http
      scheme: bearer
      bearerFormat: JWT
