openapi: 3.0.2
info:
  title: Foodgram
  version: 1.0.0
  description: |
    REST API Foodgram.

    Схема используется как источник правды для документации и для
    кодогенерации C++-структур запросов через `userver_target_generate_chaotic`.

    Тела ответов собираются вручную через `userver::formats::json::ValueBuilder`,
    поэтому response-схемы описывают JSON-форму ответа, а не C++-типы.

    Защищённые эндпоинты требуют заголовок `Authorization: Bearer <JWT>`
    (см. `components/securitySchemes/bearerAuth`). Auth настраивается
    в static_config: `auth: {types: [bearer]}`.
servers:
  - url: /api
paths:
  /users/:
    get:
      operationId: list_users
      description: 'Список пользователей с пагинацией.'
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 'Страница пользователей.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
    post:
      operationId: register_user
      description: 'Регистрация нового пользователя.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomUserCreate'
      responses:
        '201':
          description: 'Пользователь успешно создан.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUserResponseOnCreate'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
  /recipes/:
    get:
      operationId: list_recipes
      description: 'Страница доступна всем пользователям. Доступна фильтрация по избранному, автору и списку покупок.'
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: is_favorited
          in: query
          required: false
          description: 'Показывать только рецепты, находящиеся в списке избранного (1/true — да, 0/false — нет).'
          schema:
            oneOf:
              - type: boolean
              - type: integer
                minimum: 0
                maximum: 1
        - name: is_in_shopping_cart
          in: query
          required: false
          description: 'Показывать только рецепты, находящиеся в списке покупок (1/true — да, 0/false — нет).'
          schema:
            oneOf:
              - type: boolean
              - type: integer
                minimum: 0
                maximum: 1
        - name: author
          in: query
          required: false
          description: 'Показывать рецепты только автора с указанным id.'
          schema:
            type: integer
      responses:
        '200':
          description: 'Страница рецептов.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Рецепты
    post:
      operationId: create_recipe
      description: 'Доступно только авторизованному пользователю.'
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '201':
          description: 'Рецепт успешно создан.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      tags:
        - Рецепты
  /recipes/{id}/:
    get:
      operationId: get_recipe
      description: 'Получение рецепта по id.'
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '200':
          description: 'Рецепт.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Рецепты
    patch:
      operationId: update_recipe
      description: 'Доступно только автору данного рецепта.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdate'
      responses:
        '200':
          description: 'Рецепт успешно обновлён.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Рецепты
    delete:
      operationId: delete_recipe
      description: 'Доступно только автору данного рецепта.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '204':
          description: 'Рецепт успешно удалён.'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Рецепты
  /recipes/{id}/favorite/:
    post:
      operationId: add_recipe_to_favorites
      description: 'Доступно только авторизованному пользователю.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '201':
          description: 'Рецепт успешно добавлен в избранное.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeMinified'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Избранное
    delete:
      operationId: remove_recipe_from_favorites
      description: 'Доступно только авторизованным пользователям.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '204':
          description: 'Рецепт успешно удалён из избранного.'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Избранное
  /recipes/{id}/shopping_cart/:
    post:
      operationId: add_recipe_to_shopping_cart
      description: 'Доступно только авторизованным пользователям.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '201':
          description: 'Рецепт успешно добавлен в список покупок.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeMinified'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Список покупок
    delete:
      operationId: remove_recipe_from_shopping_cart
      description: 'Доступно только авторизованным пользователям.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecipeId'
      responses:
        '204':
          description: 'Рецепт успешно удалён из списка покупок.'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Список покупок
  /recipes/download_shopping_cart/:
    get:
      operationId: download_shopping_cart
      description: 'Скачать список покупок в формате PDF. Доступно только авторизованным пользователям.'
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: 'PDF-файл со списком покупок.'
          headers:
            Content-Disposition:
              description: 'Имя файла для скачивания.'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      tags:
        - Список покупок
  /users/{id}/:
    get:
      operationId: get_user
      description: 'Профиль пользователя. Доступно всем пользователям.'
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 'Профиль пользователя.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
  /users/me/:
    get:
      operationId: get_current_user
      description: 'Профиль текущего авторизованного пользователя.'
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: 'Профиль текущего пользователя.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
  /users/me/avatar/:
    put:
      operationId: set_user_avatar
      description: 'Добавление аватара текущего пользователя.'
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvatar'
      responses:
        '200':
          description: 'Аватар успешно добавлен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAvatarResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
    delete:
      operationId: delete_user_avatar
      description: 'Удаление аватара текущего пользователя.'
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '204':
          description: 'Аватар успешно удалён.'
        '401':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
  /users/subscriptions/:
    get:
      operationId: list_subscriptions
      description: 'Возвращает пользователей, на которых подписан текущий пользователь. В выдачу добавляются рецепты.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RecipesLimit'
      responses:
        '200':
          description: 'Страница подписок.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Подписки
  /users/{id}/subscribe/:
    post:
      operationId: subscribe_to_user
      description: 'Доступно только авторизованным пользователям.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RecipesLimit'
      responses:
        '201':
          description: 'Подписка успешно создана.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithRecipes'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Подписки
    delete:
      operationId: unsubscribe_from_user
      description: 'Доступно только авторизованным пользователям.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: 'Успешная отписка.'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      tags:
        - Подписки
  /ingredients/:
    get:
      operationId: list_ingredients
      description: 'Список ингредиентов с возможностью поиска по имени.'
      parameters:
        - name: name
          in: query
          required: false
          description: 'Поиск по частичному вхождению в начале названия ингредиента.'
          schema:
            type: string
      responses:
        '200':
          description: 'Список ингредиентов (без пагинации).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientList'
      tags:
        - Ингредиенты
  /ingredients/{id}/:
    get:
      operationId: get_ingredient
      description: 'Получение ингредиента по id.'
      parameters:
        - $ref: '#/components/parameters/IngredientId'
      responses:
        '200':
          description: 'Ингредиент.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Ингредиенты
  /users/set_password/:
    post:
      operationId: set_password
      description: 'Изменение пароля текущего пользователя.'
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
      responses:
        '204':
          description: 'Пароль успешно изменён.'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
  /auth/token/login/:
    post:
      operationId: login
      description: 'Авторизация по email и паролю. Возвращает JWT-токен для последующих запросов.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '200':
          description: 'Токен успешно получен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenGetResponse'
        '401':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
  /auth/token/logout/:
    post:
      operationId: logout
      description: 'Выход из системы. JWT-токен stateless, поэтому сервер просто подтверждает выход.'
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '204':
          description: 'Выход выполнен.'
        '401':
          $ref: '#/components/responses/Error'
      tags:
        - Пользователи
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 'Номер страницы, начиная с 1. По умолчанию 1. Страница вне диапазона — 404.'
      schema:
        type: integer
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: 'Количество объектов на странице. По умолчанию 6. Значения больше 100 приводятся к 100, значения меньше 1 игнорируются и берётся значение по умолчанию.'
      schema:
        type: integer
        default: 6
    RecipesLimit:
      name: recipes_limit
      in: query
      required: false
      description: 'Количество рецептов внутри поля recipes. По умолчанию 100. Значения меньше 1 и нечисловые значения игнорируются и берётся значение по умолчанию.'
      schema:
        type: integer
        default: 100
    RecipeId:
      name: id
      in: path
      required: true
      description: 'Уникальный идентификатор рецепта.'
      schema:
        type: integer
    UserId:
      name: id
      in: path
      required: true
      description: 'Уникальный идентификатор пользователя.'
      schema:
        type: integer
    IngredientId:
      name: id
      in: path
      required: true
      description: 'Уникальный идентификатор ингредиента.'
      schema:
        type: integer
  schemas:
    # ------------------------------------------------------------------
    # Запросы. chaotic генерирует для них C++-структуры и валидирует их.
    # ------------------------------------------------------------------
    CustomUserCreate:
      description: 'Регистрация пользователя.'
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+\z'
          description: 'Адрес электронной почты.'
          example: 'vpupkin@yandex.ru'
        username:
          type: string
          pattern: ^[\w.@+-]+\z
          minLength: 1
          maxLength: 150
          description: 'Уникальный юзернейм.'
          example: 'vasya.pupkin'
        first_name:
          type: string
          maxLength: 150
          description: 'Имя.'
          example: 'Вася'
        last_name:
          type: string
          maxLength: 150
          description: 'Фамилия.'
          example: 'Иванов'
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 'Пароль.'
          example: 'Qwerty123'
      required:
        - email
        - username
        - first_name
        - last_name
        - password
    SetAvatar:
      description: 'Добавление аватара пользователя.'
      type: object
      additionalProperties: false
      properties:
        avatar:
          type: string
          minLength: 1
          description: 'Картинка, закодированная в Base64 (data URL или чистый Base64).'
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAgMAAABieywaAAAACVBMVEUAAAD///9fX1/S0ecCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAACklEQVQImWNoAAAAggCByxOyYQAAAABJRU5ErkJggg=='
      required:
        - avatar
    IngredientAmount:
      description: 'Ингредиент с количеством в рецепте.'
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: 'Уникальный id ингредиента.'
          example: 1123
        amount:
          type: integer
          minimum: 1
          description: 'Количество в рецепте.'
          example: 10
      required:
        - id
        - amount
    RecipeCreate:
      description: 'Создание рецепта.'
      type: object
      additionalProperties: false
      properties:
        ingredients:
          description: 'Список ингредиентов.'
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredientAmount'
        image:
          description: 'Картинка, закодированная в Base64 (data URL или чистый Base64).'
          type: string
          minLength: 1
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAgMAAABieywaAAAACVBMVEUAAAD///9fX1/S0ecCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAACklEQVQImWNoAAAAggCByxOyYQAAAABJRU5ErkJggg=='
        name:
          description: 'Название.'
          type: string
          minLength: 1
          maxLength: 256
          example: 'Борщ'
        text:
          description: 'Описание.'
          type: string
          minLength: 1
          example: 'Классический украинский суп.'
        cooking_time:
          description: 'Время приготовления (в минутах).'
          type: integer
          minimum: 1
          example: 90
      required:
        - ingredients
        - image
        - name
        - text
        - cooking_time
    RecipeUpdate:
      description: 'Частичное обновление рецепта. Все поля необязательны.'
      type: object
      additionalProperties: false
      properties:
        id:
          description: 'Идентификатор рецепта. Не используется, принимается для совместимости.'
          type: integer
        ingredients:
          description: 'Список ингредиентов.'
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredientAmount'
        image:
          description: 'Картинка, закодированная в Base64 (data URL или чистый Base64).'
          type: string
          minLength: 1
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABAgMAAABieywaAAAACVBMVEUAAAD///9fX1/S0ecCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAACklEQVQImWNoAAAAggCByxOyYQAAAABJRU5ErkJggg=='
        name:
          description: 'Название.'
          type: string
          minLength: 1
          maxLength: 256
          example: 'Борщ'
        text:
          description: 'Описание.'
          type: string
          minLength: 1
          example: 'Классический украинский суп.'
        cooking_time:
          description: 'Время приготовления (в минутах).'
          type: integer
          minimum: 1
          example: 90
    SetPassword:
      description: 'Изменение пароля.'
      type: object
      additionalProperties: false
      properties:
        new_password:
          type: string
          minLength: 8
