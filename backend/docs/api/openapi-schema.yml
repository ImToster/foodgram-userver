    TokenCreate:
      description: 'Получение токена авторизации.'
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+\z'
