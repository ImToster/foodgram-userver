volumes:
  pg_data:
  silo_data:
  static:

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/postgresql/schemas/foodgram/migrations:/migrations:ro
      - ./backend/postgresql/initial_data:/initial_data:ro
      - ./backend/demo_data:/demo_data:ro
      - ./backend/postgresql/initdb.sh:/docker-entrypoint-initdb.d/00_init.sh:ro

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./backend/demo_data/media:/seed
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://silo:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      mc mb local/$$S3_BUCKET --ignore-existing;
      mc anonymous set download local/$$S3_BUCKET;
      if [ -d /seed ]; then mc mirror --overwrite --exclude '.gitkeep' /seed local/$$S3_BUCKET; fi;
      exit 0;
      "

  backend:
    build: ./backend
    environment:
      DB_CONNECTION: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost/media}
    depends_on:
      db:
        condition: service_healthy
      silo:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    volumes:
      - static:/frontend_static
    restart: "no"

  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - static:/staticfiles:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
      silo:
        condition: service_healthy
